<svg width="800" height="180" viewBox="0 0 800 180"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#00f5ff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="180" rx="25"
        fill="url(#bg)"
        stroke="#30363d"/>

  <!-- Name -->
  <text x="400" y="45"
        text-anchor="middle"
        font-family="Arial"
        font-size="25"
        font-weight="bold"
        fill="white">
    RANJITH REDDY
  </text>

  <!-- ROLE 1 -->
  <text x="400" y="105"
        text-anchor="middle"
        font-family="monospace"
        font-size="30"
        font-weight="bold"
        fill="url(#text)">
    💻 Full-Stack Developer
    <animate attributeName="opacity"
      values="1;1;0;0;0;0"
      keyTimes="0;0.16;0.20;0.96;0.98;1"
      dur="10s"
      repeatCount="indefinite"/>
  </text>

  <!-- ROLE 2 -->
  <text x="400" y="105"
        text-anchor="middle"
        font-family="monospace"
        font-size="30"
        font-weight="bold"
        fill="url(#text)"
        opacity="0">
    🤖 AI/ML Engineer
    <animate attributeName="opacity"
      values="0;0;1;1;0;0"
      keyTimes="0;0.18;0.20;0.36;0.40;1"
      dur="10s"
      repeatCount="indefinite"/>
  </text>

  <!-- ROLE 3 -->
  <text x="400" y="105"
        text-anchor="middle"
        font-family="monospace"
        font-size="30"
        font-weight="bold"
        fill="url(#text)"
        opacity="0">
    🧠 Deep Learning Engineer
    <animate attributeName="opacity"
      values="0;0;1;1;0;0"
      keyTimes="0;0.38;0.40;0.56;0.60;1"
      dur="10s"
      repeatCount="indefinite"/>
  </text>

  <!-- ROLE 4 -->
  <text x="400" y="105"
        text-anchor="middle"
        font-family="monospace"
        font-size="30"
        font-weight="bold"
        fill="url(#text)"
        opacity="0">
    📊 Data Scientist
    <animate attributeName="opacity"
      values="0;0;1;1;0;0"
      keyTimes="0;0.58;0.60;0.76;0.80;1"
      dur="10s"
      repeatCount="indefinite"/>
  </text>

  <!-- ROLE 5 -->
  <text x="400" y="105"
        text-anchor="middle"
        font-family="monospace"
        font-size="30"
        font-weight="bold"
        fill="url(#text)"
        opacity="0">
    🐍 Python Developer
    <animate attributeName="opacity"
      values="0;0;1;1;0;0"
      keyTimes="0;0.78;0.80;0.96;0.98;1"
      dur="10s"
      repeatCount="indefinite"/>
  </text>

  <!-- Subtitle -->
  <text x="400" y="145"
        text-anchor="middle"
        font-family="Arial"
        font-size="14"
        fill="#8b949e">
    AI &amp; Data Science • Building intelligent solutions
  </text>

</svg>
